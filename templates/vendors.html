<!DOCTYPE html>
<html>
<head>
    <title>Vendors</title>

    <style>

        body{
            font-family:Arial;
            background:linear-gradient(135deg,#141e30,#243b55);
            margin:0;
            color:white;
        }

        .container{
            width:85%;
            margin:auto;
            padding:30px;
        }

        .card{
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(10px);
            padding:30px;
            border-radius:20px;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#ff512f;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        table{
            width:100%;
            margin-top:30px;
            border-collapse:collapse;
        }

        table th, table td{
            padding:15px;
            background:rgba(255,255,255,0.08);
            text-align:center;
        }

        a{
            color:white;
            text-decoration:none;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Vendor Management</h1>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Vendor Name"
                   required>

            <input type="text"
                   name="contact"
                   placeholder="Contact Number"
                   required>

            <button type="submit">

                Add Vendor

            </button>

        </form>

        <table>

            <tr>
                <th>ID</th>
                <th>Vendor Name</th>
                <th>Contact</th>
            </tr>

            {% for v in vendors %}

            <tr>
                <td>{{ v.id }}</td>
                <td>{{ v.name }}</td>
                <td>{{ v.contact }}</td>
            </tr>

            {% endfor %}

        </table>

        <br>

        <a href="/dashboard">

            ← Back to Dashboard

        </a>

    </div>

</div>

</body>
</html>
