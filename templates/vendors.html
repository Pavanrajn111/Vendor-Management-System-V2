<!DOCTYPE html>
<html>
<head>

    <title>Available Vendors</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#eef2f7;
        }

        .container{
            width:90%;
            margin:auto;
            padding:40px 0;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            color:#1d2671;
            font-size:42px;
        }

        /* GRID */

        .vendors-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:30px;
        }

        /* CARD */

        .vendor-card{
            background:white;
            border-radius:20px;
            padding:30px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.12);
            transition:0.3s;
        }

        .vendor-card:hover{
            transform:translateY(-8px);
        }

        .vendor-card img{
            width:90px;
            height:90px;
            border-radius:50%;
            margin-bottom:20px;
        }

        .vendor-card h2{
            color:#1d2671;
            margin-bottom:10px;
        }

        .mobile{
            color:gray;
            margin-bottom:25px;
            font-size:18px;
        }

        /* BUTTONS */

        .btn{
            display:block;
            width:100%;
            padding:14px;
            margin-top:12px;
            border:none;
            border-radius:12px;
            text-decoration:none;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .review-btn{
            background:#1d2671;
        }

        .review-btn:hover{
            background:#2d3ea0;
        }

        .product-btn{
            background:#009688;
        }

        .product-btn:hover{
            background:#00b3a1;
        }

        .connect-btn{
            background:#ff512f;
        }

        .connect-btn:hover{
            background:#ff774f;
        }

        .connected{
            background:gray;
            cursor:not-allowed;
        }

        /* BACK BUTTON */

        .back-btn{
            display:inline-block;
            margin-top:40px;
            padding:14px 22px;
            background:#ff512f;
            color:white;
            text-decoration:none;
            border-radius:12px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:#ff774f;
            transform:scale(1.05);
        }

        /* MOBILE */

        @media(max-width:900px){

            .vendors-grid{
                grid-template-columns:1fr;
            }

        }
.vendor-container{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
    margin-top:40px;
}

.vendor-card{
    background:white;
    border-radius:20px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    transition:0.3s;
}

.vendor-card:hover{
    transform:translateY(-8px);
}

.vendor-icon{
    font-size:55px;
    margin-bottom:15px;
}

.vendor-card h2{
    color:#1d2671;
    margin-bottom:10px;
}

.mobile{
    color:#555;
    font-size:17px;
    margin-bottom:25px;
}

.btn-group{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn-group form{
    margin:0;
}

.connect-btn,
.connected-btn,
.product-btn,
.review-btn{

    display:block;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    text-decoration:none;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

.connect-btn{
    background:#1d2671;
}

.connect-btn:hover{
    background:#243b55;
}

.connected-btn{
    background:#28a745;
}

.product-btn{
    background:#ff9800;
}

.product-btn:hover{
    background:#ffb347;
}

.review-btn{
    background:#c33764;
}

.review-btn:hover{
    background:#d94f7a;
}

@media(max-width:768px){

    .vendor-container{
        grid-template-columns:1fr;
    }
}
.connected-btn{

    background:#28a745;
    color:white;
    border:none;
    cursor:not-allowed;
    opacity:0.9;

}

    </style>

</head>

<body>

<div class="container">

    <h1>Available Vendors</h1>

    <div class="vendor-container">

    {% for v in vendors %}

    <div class="vendor-card">

        <div class="vendor-icon">
            🏢
        </div>

        <h2>
            {{ v['username'] }}
        </h2>

        <p class="mobile">
            📞 {{ v['mobile'] }}
        </p>

        <div class="btn-group">

            {% if v['username'] in connected_vendors %}

    <button class="connected-btn"
            disabled>

        Connected

    </button>

{% else %}

<form method="POST"
      action="/select_vendor">

    <input type="hidden"
           name="vendor"
           value="{{ v['username'] }}">

    <button class="connect-btn"
            type="submit">

        Connect

    </button>

</form>

{% endif %}
            <a href="/vendor_products/{{ v['username'] }}"
               class="product-btn">

               View Products

            </a>

            <a href="/vendor_reviews/{{ v['username'] }}"
               class="review-btn">

               View Reviews

            </a>

        </div>

    </div>

    {% endfor %}

    </div>

</div>

    <a href="/dashboard"
       class="back-btn">

       ← Back to Dashboard

    </a>

</div>

</body>
</html>
