<!DOCTYPE html>
<html>
<head>
    <title>Login - Vendor Management System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#141e30,#243b55);
            overflow:hidden;
        }

        /* Animated Background */

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.08);
            animation:float 6s infinite ease-in-out;
        }

        .circle:nth-child(1){
            width:140px;
            height:140px;
            top:10%;
            left:12%;
        }

        .circle:nth-child(2){
            width:180px;
            height:180px;
            bottom:10%;
            right:12%;
            animation-duration:8s;
        }

        @keyframes float{
            0%{ transform:translateY(0px); }
            50%{ transform:translateY(-20px); }
            100%{ transform:translateY(0px); }
        }

        /* LOGIN BOX */

        .login-box{
            position:relative;
            width:420px;
            background:rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius:20px;
            padding:35px;
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            color:white;
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(-20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            font-size:32px;
        }

        .slogan{
            text-align:center;
            color:#ddd;
            margin-bottom:25px;
            font-size:14px;
        }

        /* INPUTS */

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:15px;
            transition:0.3s;
        }

        input:focus{
            transform:scale(1.02);
            box-shadow:0 0 10px rgba(255,255,255,0.5);
        }

        /* PASSWORD BOX */

.password-box{
    position:relative;
}

/* EYE ICON */

.toggle-password{
    position:absolute;
    right:15px;
    top:30px;
    cursor:pointer;
    color:#444;
    font-size:20px;
    transition:0.3s;
}

.toggle-password:hover{
    transform:scale(1.15);
    color:#000;
}

        /* ERROR MESSAGE */

        .error-message{
    color:#ff4d4d;
    margin-top:12px;
    text-align:center;
    font-weight:bold;
    font-size:15px;
}

        /* BUTTON */

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#ff512f,#dd2476);
            color:white;
            font-size:17px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.03);
            box-shadow:0 0 15px rgba(255,255,255,0.4);
        }

        /* LINK */

        a{
            display:block;
            text-align:center;
            margin-top:18px;
            color:#fff;
            text-decoration:none;
            font-weight:bold;
        }

    </style>
</head>

<body>

    <!-- Background Circles -->

    <div class="circle"></div>
    <div class="circle"></div>

    <!-- LOGIN BOX -->

    <div class="login-box">

        <h1>Vendor Management System</h1>

        <p class="slogan">
            “Secure Vendors • Smart Business • Better Management”
        </p>

        <form method="POST">

            <!-- USERNAME -->

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

          <!-- Font Awesome Icons -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- PASSWORD BOX -->

<div class="password-box">

    <input type="password"
           id="password"
           name="password"
           placeholder="Enter Password"
           required>

    <!-- Eye Icon -->

    <span class="toggle-password"
          onclick="togglePassword()">

        <i class="fa-solid fa-eye-slash"
           id="eyeIcon"></i>

    </span>

</div>

            <!-- INVALID PASSWORD MESSAGE -->

           {% if error %}

        <div class="error-message">

    {{ error }}

        </div>

        {% endif %} 

            <!-- BUTTON -->

            <button type="submit">

                Login

            </button>

        </form>

        <a href="/register">

            New user? Register here

        </a>

    </div>

<script>

function togglePassword(){

    let password = document.getElementById("password");

    let eyeIcon = document.getElementById("eyeIcon");

    if(password.type === "password"){

        password.type = "text";

        eyeIcon.classList.remove("fa-eye-slash");

        eyeIcon.classList.add("fa-eye");
    }

    else{

        password.type = "password";

        eyeIcon.classList.remove("fa-eye");

        eyeIcon.classList.add("fa-eye-slash");
    }
}

</script>

</body>
</html>
