<!DOCTYPE html>
<html>
<head>
    <title>Vendor Reviews</title>

    <style>

        body{
            font-family:Arial;
            background:linear-gradient(135deg,#141e30,#243b55);
            color:white;
        }

        .container{
            width:85%;
            margin:auto;
            padding:30px;
        }

        .card{
            background:rgba(255,255,255,0.12);
            padding:30px;
            border-radius:20px;
            backdrop-filter:blur(10px);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
        }

        h2{
            margin-top:30px;
            margin-bottom:15px;
        }

        select,input,button{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
        }

        button{
            background:#ff512f;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#ff774f;
        }

        table{
            width:100%;
            margin-top:25px;
            border-collapse:collapse;
        }

        table th{
            background:#ff512f;
            padding:15px;
        }

        table td{
            background:rgba(255,255,255,0.08);
            padding:15px;
            text-align:center;
        }

        tr:hover td{
            background:rgba(255,255,255,0.15);
        }

        .rating{
            background:#28a745;
            padding:6px 14px;
            border-radius:20px;
            font-size:14px;
        }

        .back-btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 20px;
            background:#ff512f;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }

    </style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Vendor Reviews</h1>

<!-- CUSTOMER CAN ADD REVIEW -->

{% if session['role'] == 'customer' %}

<h2>Add Review</h2>

<form method="POST">

    <label>Select Connected Vendor</label>

    <select name="vendor" required>

        {% for v in vendors %}

        <option value="{{ v['vendor'] }}">

            {{ v['vendor'] }}

        </option>

        {% endfor %}

    </select>

    <label>Rating</label>

    <input type="number"
           name="rating"
           min="1"
           max="5"
           required>

    <label>Comment</label>

    <input type="text"
           name="comment"
           placeholder="Write your review"
           required>

    <button type="submit">

        Submit Review

    </button>

</form>

{% endif %}

<!-- ALL VENDOR REVIEWS -->

<h2>All Vendor Reviews</h2>

<table>

<tr>

    <th>Customer</th>

    <th>Vendor</th>

    <th>Rating</th>

    <th>Comment</th>

</tr>

{% for r in reviews %}

<tr>

    <td>

        {{ r['customer'] }}

    </td>

    <td>

        {{ r['vendor'] }}

    </td>

    <td>

        <span class="rating">

            {{ r['rating'] }}/5

        </span>

    </td>

    <td>

        {{ r['comment'] }}

    </td>

</tr>

{% endfor %}

</table>

<br>

<a href="/dashboard" class="back-btn">

    ← Back to Dashboard

</a>

</div>

</div>

</body>
</html>
