<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <style>

        body{
            font-family:Arial;
            background:linear-gradient(135deg,#141e30,#243b55);
            margin:0;
            color:white;
        }

        .container{
            width:85%;
            margin:auto;
            padding:30px;
        }

        .card{
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(10px);
            padding:30px;
            border-radius:20px;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#ff512f;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        table{
            width:100%;
            margin-top:30px;
            border-collapse:collapse;
        }

        table th, table td{
            padding:15px;
            background:rgba(255,255,255,0.08);
            text-align:center;
        }
        .back-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#ff512f;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
}

.back-btn:hover{
    background:#ff774f;
    transform:scale(1.05);
}

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Products</h1>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Product Name"
                   required>

            <input type="number"
                   name="price"
                   placeholder="Price"
                   required>

            <button type="submit">

                Add Product

            </button>

        </form>

        <table>

            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Price</th>
            </tr>

            {% for p in products %}

            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.price }}</td>
            </tr>

            {% endfor %}

        </table>
        <br>

<a href="/dashboard" class="back-btn">

    ← Back to Dashboard

</a>


    </div>

</div>


</body>
</html>
