<!DOCTYPE html>
<html>
<head>
    <title>Payments</title>

    <style>

        body{
            font-family:Arial;
            background:linear-gradient(135deg,#141e30,#243b55);
            color:white;
        }

        .container{
            width:85%;
            margin:auto;
            padding:30px;
        }

        .card{
            background:rgba(255,255,255,0.12);
            padding:30px;
            border-radius:20px;
            backdrop-filter:blur(10px);
        }

        select,input,button{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
        }

        button{
            background:#ff512f;
            color:white;
        }

        table{
            width:100%;
            margin-top:30px;
        }

        table th,table td{
            padding:15px;
            background:rgba(255,255,255,0.08);
            text-align:center;
        }
        .back-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#ff512f;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
}

.back-btn:hover{
    background:#ff774f;
    transform:scale(1.05);
}

    </style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Payments</h1>

<form method="POST">

<select name="order_id">

{% for o in orders %}

<option value="{{o.id}}">

Order {{o.id}}

</option>

{% endfor %}

</select>

<input type="number"
       name="amount"
       placeholder="Payment Amount">

<button type="submit">

Add Payment

</button>

</form>

<table>

<tr>
<th>ID</th>
<th>Order ID</th>
<th>Amount</th>
</tr>

{% for p in payments %}

<tr>
<td>{{p.id}}</td>
<td>{{p.order_id}}</td>
<td>{{p.amount}}</td>
</tr>

{% endfor %}

</table>
        <br>

<a href="/dashboard" class="back-btn">

    ← Back to Dashboard

</a>

</div>

</div>


</body>
</html>
